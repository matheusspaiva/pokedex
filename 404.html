<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Redirecionando para a Pokédex</title>
    <script>
      // O GitHub Pages não possui fallback de SPA. Quando uma rota interna
      // é recarregada, este arquivo encaminha a URL para o index.html.
      (function (location) {
        var segments = location.pathname.split('/');
        // The repository Pages URL is /pokedex/, but the app may also be
        // served from a custom/user Pages domain at /. Preserve either base.
        var isProjectPages = segments[1] === 'pokedex';
        var segmentsToKeep = isProjectPages ? 1 : 0;
        var path = segments.slice(0, 1 + segmentsToKeep).join('/');
        var route = segments
          .slice(1 + segmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~');
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : '';

        location.replace(
          location.protocol +
            '//' +
            location.hostname +
            (location.port ? ':' + location.port : '') +
            path +
            '/?/' +
            route +
            query +
            location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
